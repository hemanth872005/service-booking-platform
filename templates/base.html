<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ServiceHub{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container">
<a class="navbar-brand fw-bold" href="{% url 'home' %}">ServiceHub</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto">
<a class="nav-link" href="{% url 'home' %}">Browse services</a>
{% if user.is_authenticated %}<a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
<form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="nav-link btn btn-link">Log out</button></form>
{% else %}<a class="nav-link" href="{% url 'login' %}">Log in</a><a class="nav-link" href="{% url 'register' %}">Register</a>{% endif %}
</div></div></div></nav>
<main class="container py-4">
{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}
{% block content %}{% endblock %}</main>
<footer class="text-center text-muted py-4">ServiceHub · Service Booking and Management Platform</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/static/js/app.js"></script></body></html>
